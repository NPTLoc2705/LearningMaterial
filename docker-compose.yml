services:
  postgres:
    image: postgres:16-alpine
    container_name: learning-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: learning_platform_dev
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_platform_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

